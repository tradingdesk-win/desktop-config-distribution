id: tushare
name: Tushare
description: Tushare Pro 股票与 A 股指数日线行情（运行时注入 API Token）
version: 1.1.1
enabled: false
api:
  base_url: https://api.tushare.pro
  timeout: 10s
  max_retry: 2
  retry_backoff: 1s
  headers:
    Content-Type: application/json
  kline:
    price_basis: RAW
    endpoint: https://api.tushare.pro
    method: POST
    date_format: "20060102"
    body_encoding: json
    body:
      api_name: daily
      token: ${TUSHARE_TOKEN}
      fields: ts_code,trade_date,open,high,low,close,vol,amount
      params:
        ts_code: '{{symbol}}'
        start_date: '{{startDate}}'
        end_date: '{{endDate}}'

response:
  error:
    code_path: code
    success_values: ["0"]
    message_path: msg
  encoding: utf-8
  format: json
  kline:
    data_path: data.items
    row_format: array
    field_mapping:
      timestamp: {index: 1, type: time, formats: ['20060102'], day_close_time: '15:00:00'}
      open_px: {index: 2, type: float}
      high_px: {index: 3, type: float}
      low_px: {index: 4, type: float}
      close_px: {index: 5, type: float}
      volume: {index: 6, type: float, transform: multiply:100}
      turnover_value: {index: 7, type: float, transform: multiply:1000}
symbol:
  output_template: '{{code}}.{{EXCHANGE}}'
  exchange_rules:
  - {pattern: '^920[0-9]{3}$', exchange: bj}
  exchange_mapping:
    sh: SH
    sz: SZ
period_mapping: {1d: day}
limits:
  kline_pagination_directions: [older, newer]
  supported_periods: [1d]
metadata:
  token_env: TUSHARE_TOKEN
  token_required: true
  rate_limit: '依 Tushare Pro 账号积分与接口限流策略'
  api_key_validation: '启动或启用前必须提供非空 TUSHARE_TOKEN；禁止将 token 写入配置文件'
auth:
  type: api_key
  fields:
    - name: token
      label: Tushare API Token
      secret: true
      required: true
      env: TUSHARE_TOKEN
supported_markets: [CN]
supported_types: [STOCK, INDEX]
index_daily:
  market: CN_STOCK
  format_unlisted: true
  request:
    endpoint: https://api.tushare.pro
    method: POST
    body_encoding: json
    body:
      api_name: index_daily
      token: ${TUSHARE_TOKEN}
      fields: ts_code,trade_date,close,pre_close,pct_chg
      params: {ts_code: '{{symbol}}', start_date: '{{startDate}}', end_date: '{{endDate}}'}
  rows: data.items
  date_format: '20060102'
  fields: {symbol: '[0]', date: '[1]', close: '[2]', previous: '[3]', change: '[4]'}
