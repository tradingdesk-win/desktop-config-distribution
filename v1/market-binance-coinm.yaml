id: binance-coinm
name: Binance COIN-M Futures
description: Public historical COIN-M derivative candles only.
version: 1.0.0
enabled: false
supported_markets: [CRYPTO]
supported_types: [CRYPTO_PERP, CRYPTO_DELIVERY]
api:
  base_url: https://dapi.binance.com
  timeout: 15s
  max_retry: 0
  kline:
    price_basis: UNKNOWN
    endpoint: /dapi/v1/klines
    method: GET
    date_format: unix_ms
    params:
      pair: '{{contract}}'
      interval: '{{period}}'
      startTime: '{{startTimestamp}}'
      endTime: '{{endTimestamp}}'
      limit: '1500'
response:
  format: json
  kline:
    data_path: $
    row_format: array
    field_mapping:
      timestamp: {index: 0, type: time}
      open_px: {index: 1, type: float}
      high_px: {index: 2, type: float}
      low_px: {index: 3, type: float}
      close_px: {index: 4, type: float}
period_mapping: {1m: 1m, 5m: 5m, 15m: 15m, 30m: 30m, 1h: 1h, 2h: 2h, 4h: 4h, 1d: 1d}
metadata:
  derivative_market:
    exchange: BINANCE
    settlement_type: INVERSE
    contract_pattern: '^[A-Z0-9]+USD(?:_[0-9]{6}|_PERP)$'
    expiry_format: '060102'
    expiry_prefix: '_'
    volumes:
      - {index: 5, unit: CONTRACTS}
      - {index: 7, unit: BASE}
      - {index: 9, unit: CONTRACTS}
      - {index: 10, unit: BASE}
    documentation: https://developers.binance.com/docs/derivatives/coin-margined-futures/market-data/rest-api/Kline-Candlestick-Data
    unit_evidence: https://github.com/binance/binance-public-data/issues/168
limits:
  max_data_points: 1500
  kline_pagination_directions: [older, newer]
  supported_periods: [1m, 5m, 15m, 30m, 1h, 2h, 4h, 1d]
